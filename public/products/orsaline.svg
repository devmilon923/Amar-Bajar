<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- Soft background plate -->
  <rect width="240" height="240" rx="4" fill="#f8fafc"/>
  
  <!-- Sachet Shadow -->
  <rect x="62" y="58" width="116" height="136" rx="4" fill="#e2e8f0"/>
  
  <!-- Sachet Body (SMC ORSaline-N Foil Sachet) -->
  <rect x="60" y="55" width="120" height="135" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  
  <!-- Top Seal Ribs -->
  <rect x="60" y="55" width="120" height="12" fill="#15803d"/>
  <line x1="65" y1="61" x2="175" y2="61" stroke="#86efac" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- SMC Logo Circle -->
  <circle cx="120" cy="90" r="16" fill="#16a34a"/>
  <text x="120" y="94" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">SMC</text>

  <!-- ORSaline-N Title -->
  <text x="120" y="122" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#15803d" text-anchor="middle">ORSaline-N</text>
  <text x="120" y="136" font-family="'Noto Serif Bengali', system-ui, sans-serif" font-size="9" font-weight="600" fill="#334155" text-anchor="middle">খাবার স্যালাইন</text>
  <text x="120" y="150" font-family="system-ui, sans-serif" font-size="7.5" font-weight="500" fill="#64748b" text-anchor="middle">Oral Rehydration Salts (WHO formula)</text>

  <!-- Bottom Seal -->
  <rect x="60" y="178" width="120" height="12" fill="#15803d"/>
  <line x1="65" y1="184" x2="175" y2="184" stroke="#86efac" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- Pack Unit Badge -->
  <rect x="70" y="202" width="100" height="20" rx="3" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="120" y="216" font-family="'Noto Serif Bengali', system-ui, sans-serif" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">স্যালাইন • এস এম সি</text>
</svg>
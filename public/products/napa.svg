<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- Soft background plate -->
  <rect width="240" height="240" rx="4" fill="#f8fafc"/>
  
  <!-- Blister Pack Shadow -->
  <rect x="52" y="62" width="136" height="116" rx="4" fill="#e2e8f0"/>
  
  <!-- Blister Pack Foil Card -->
  <rect x="50" y="60" width="140" height="120" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Red Napa Brand Bar -->
  <rect x="50" y="60" width="140" height="28" rx="2" fill="#ef4444"/>
  <text x="120" y="78" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Napa Extra</text>
  
  <!-- Beximco Pharma Sub-brand -->
  <text x="120" y="98" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#64748b" text-anchor="middle">Beximco Pharmaceuticals</text>
  <text x="120" y="108" font-family="system-ui, sans-serif" font-size="7.5" font-weight="500" fill="#94a3b8" text-anchor="middle">Paracetamol 500mg + Caffeine 65mg</text>

  <!-- 10 Tablet Foil Blisters (2 rows of 5) -->
  <g fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5">
    <!-- Row 1 -->
    <ellipse cx="72" cy="126" rx="9" ry="7"/>
    <ellipse cx="96" cy="126" rx="9" ry="7"/>
    <ellipse cx="120" cy="126" rx="9" ry="7"/>
    <ellipse cx="144" cy="126" rx="9" ry="7"/>
    <ellipse cx="168" cy="126" rx="9" ry="7"/>
    <!-- Row 2 -->
    <ellipse cx="72" cy="150" rx="9" ry="7"/>
    <ellipse cx="96" cy="150" rx="9" ry="7"/>
    <ellipse cx="120" cy="150" rx="9" ry="7"/>
    <ellipse cx="144" cy="150" rx="9" ry="7"/>
    <ellipse cx="168" cy="150" rx="9" ry="7"/>
  </g>
  
  <!-- Blister highlights -->
  <g fill="#ffffff" opacity="0.6">
    <ellipse cx="70" cy="124" rx="3" ry="2"/>
    <ellipse cx="94" cy="124" rx="3" ry="2"/>
    <ellipse cx="118" cy="124" rx="3" ry="2"/>
    <ellipse cx="142" cy="124" rx="3" ry="2"/>
    <ellipse cx="166" cy="124" rx="3" ry="2"/>
    <ellipse cx="70" cy="148" rx="3" ry="2"/>
    <ellipse cx="94" cy="148" rx="3" ry="2"/>
    <ellipse cx="118" cy="148" rx="3" ry="2"/>
    <ellipse cx="142" cy="148" rx="3" ry="2"/>
    <ellipse cx="166" cy="148" rx="3" ry="2"/>
  </g>

  <!-- Pack Unit Badge -->
  <rect x="70" y="200" width="100" height="20" rx="3" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="120" y="214" font-family="'Noto Serif Bengali', system-ui, sans-serif" font-size="10" font-weight="700" fill="#0369a1" text-anchor="middle">১০টি ট্যাবলেট • বেক্সিমকো</text>
</svg>
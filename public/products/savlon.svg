<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- Soft background plate -->
  <rect width="240" height="240" rx="4" fill="#f8fafc"/>
  
  <!-- Bottle Shadow -->
  <ellipse cx="120" cy="192" rx="40" ry="10" fill="#e2e8f0"/>
  
  <!-- Bottle Cap (Blue) -->
  <rect x="106" y="44" width="28" height="18" rx="2" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
  
  <!-- Bottle Neck -->
  <rect x="110" y="62" width="20" height="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Bottle Body (Amber liquid inside clear bottle) -->
  <rect x="85" y="78" width="70" height="110" rx="8" fill="url(#savlonGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <defs>
    <linearGradient id="savlonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>

  <!-- Savlon Label (Blue & White) -->
  <rect x="90" y="105" width="60" height="60" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="90" y="105" width="60" height="20" fill="#0284c7"/>
  
  <!-- Savlon Cross -->
  <rect x="94" y="111" width="8" height="8" rx="1" fill="#ffffff"/>
  <path d="M 98 112 L 98 118 M 95 115 L 101 115" stroke="#ef4444" stroke-width="1.5"/>
  <text x="122" y="119" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#ffffff">Savlon</text>

  <text x="120" y="137" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#334155" text-anchor="middle">Antiseptic</text>
  <text x="120" y="147" font-family="'Noto Serif Bengali', system-ui, sans-serif" font-size="7.5" font-weight="600" fill="#0284c7" text-anchor="middle">জীবাণুনাশক লিকুইড</text>
  <text x="120" y="157" font-family="system-ui, sans-serif" font-size="6.5" font-weight="500" fill="#64748b" text-anchor="middle">১০০ মি.লি. • ACI</text>

  <!-- Pack Unit Badge -->
  <rect x="70" y="202" width="100" height="20" rx="3" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="120" y="216" font-family="'Noto Serif Bengali', system-ui, sans-serif" font-size="10" font-weight="700" fill="#0369a1" text-anchor="middle">১০০ মি.লি. • এসিআই</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- Soft background plate -->
  <rect width="240" height="240" rx="4" fill="#f8fafc"/>
  
  <!-- Cylinder Shadow -->
  <ellipse cx="120" cy="200" rx="45" ry="10" fill="#e2e8f0"/>
  
  <!-- Top Handle Shroud (Flame Orange) -->
  <path d="M 90 60 C 90 40, 150 40, 150 60 L 150 75 L 90 75 Z" fill="#c2410c" stroke="#9a3412" stroke-width="2"/>
  <!-- Handle cutout opening -->
  <rect x="105" y="48" width="30" height="12" rx="4" fill="#f8fafc"/>

  <!-- Brass Valve & Seal -->
  <rect x="114" y="62" width="12" height="15" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <rect x="112" y="58" width="16" height="6" rx="2" fill="#ef4444"/>

  <!-- Cylinder Body (12kg Standard LP Gas) -->
  <rect x="80" y="75" width="80" height="110" rx="14" fill="url(#gasGrad)" stroke="#c2410c" stroke-width="2"/>
  
  <defs>
    <linearGradient id="gasGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="25%" stop-color="#fb923c"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
  </defs>

  <!-- Weld Seam line -->
  <line x1="80" y1="130" x2="160" y2="130" stroke="#9a3412" stroke-width="1.5"/>

  <!-- Brand / Spec Badge on Cylinder Body -->
  <rect x="92" y="95" width="56" height="25" rx="3" fill="#ffffff" opacity="0.95"/>
  <text x="120" y="112" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#c2410c" text-anchor="middle">12 KG</text>
  
  <text x="120" y="152" font-family="'Noto Serif Bengali', system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">এলপি গ্যাস</text>
  <text x="120" y="165" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#ffedd5" text-anchor="middle">LP GAS • REFILL</text>

  <!-- Bottom Foot Ring -->
  <rect x="86" y="182" width="68" height="14" rx="3" fill="#7c2d12" stroke="#9a3412" stroke-width="1.5"/>

  <!-- Certified Tag -->
  <rect x="70" y="210" width="100" height="20" rx="3" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text x="120" y="224" font-family="'Noto Serif Bengali', system-ui, sans-serif" font-size="10" font-weight="700" fill="#c2410c" text-anchor="middle">১২ কেজি সিলিন্ডার</text>
</svg>
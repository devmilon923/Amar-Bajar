<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- Soft background plate -->
  <rect width="240" height="240" rx="4" fill="#f8fafc"/>
  
  <!-- Potato Shadow -->
  <ellipse cx="120" cy="180" rx="65" ry="14" fill="#e2e8f0"/>
  
  <!-- Main Potato Body -->
  <path d="M 65 130 C 50 95, 80 65, 125 65 C 175 65, 195 90, 185 135 C 175 170, 140 180, 105 175 C 75 170, 75 155, 65 130 Z" fill="#b45309" stroke="#92400e" stroke-width="2"/>
  
  <!-- Potato Highlight and Surface Variations -->
  <path d="M 75 120 C 65 95, 90 75, 125 72 C 160 70, 178 88, 172 125 C 165 155, 135 165, 110 162 C 85 158, 82 140, 75 120 Z" fill="#d97706" opacity="0.85"/>
  <path d="M 90 100 C 85 85, 105 80, 125 80 C 145 80, 155 90, 150 110 C 145 125, 120 130, 105 125 C 95 120, 93 110, 90 100 Z" fill="#f59e0b" opacity="0.4"/>
  
  <!-- Potato Eyes & Indentations -->
  <ellipse cx="88" cy="108" rx="4" ry="2.5" fill="#78350f" transform="rotate(-15 88 108)"/>
  <ellipse cx="135" cy="95" rx="5" ry="3" fill="#78350f" transform="rotate(10 135 95)"/>
  <ellipse cx="152" cy="132" rx="4.5" ry="2.5" fill="#78350f" transform="rotate(-5 152 132)"/>
  <ellipse cx="110" cy="148" rx="4" ry="2" fill="#78350f" transform="rotate(20 110 148)"/>
  <ellipse cx="95" cy="135" rx="3.5" ry="2" fill="#78350f"/>
  
  <!-- Fresh Label Accent -->
  <rect x="70" y="200" width="100" height="20" rx="3" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="120" y="214" font-family="'Noto Serif Bengali', system-ui, sans-serif" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">নতুন গোল আলু</text>
</svg>
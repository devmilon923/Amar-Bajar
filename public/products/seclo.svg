<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- Soft background plate -->
  <rect width="240" height="240" rx="4" fill="#f8fafc"/>
  
  <!-- Strip Shadow -->
  <rect x="52" y="62" width="136" height="116" rx="4" fill="#e2e8f0"/>
  
  <!-- Strip Card -->
  <rect x="50" y="60" width="140" height="120" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Blue Seclo Brand Bar -->
  <rect x="50" y="60" width="140" height="28" rx="2" fill="#0284c7"/>
  <text x="120" y="78" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Seclo 20</text>
  
  <!-- Square Pharmaceuticals Sub-brand -->
  <text x="120" y="98" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#64748b" text-anchor="middle">Square Pharmaceuticals PLC</text>
  <text x="120" y="108" font-family="system-ui, sans-serif" font-size="7.5" font-weight="500" fill="#94a3b8" text-anchor="middle">Omeprazole 20mg (Gastric Relief)</text>

  <!-- 10 Capsule Blisters (2 rows of 5) -->
  <g fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5">
    <!-- Row 1 -->
    <rect x="64" y="118" width="16" height="16" rx="8"/>
    <rect x="88" y="118" width="16" height="16" rx="8"/>
    <rect x="112" y="118" width="16" height="16" rx="8"/>
    <rect x="136" y="118" width="16" height="16" rx="8"/>
    <rect x="160" y="118" width="16" height="16" rx="8"/>
    <!-- Row 2 -->
    <rect x="64" y="142" width="16" height="16" rx="8"/>
    <rect x="88" y="142" width="16" height="16" rx="8"/>
    <rect x="112" y="142" width="16" height="16" rx="8"/>
    <rect x="136" y="142" width="16" height="16" rx="8"/>
    <rect x="160" y="142" width="16" height="16" rx="8"/>
  </g>
  
  <!-- Capsule halves (dual tone blue / white) -->
  <g fill="#0284c7">
    <path d="M 64 126 A 8 8 0 0 1 72 118 L 72 134 A 8 8 0 0 1 64 126 Z"/>
    <path d="M 88 126 A 8 8 0 0 1 96 118 L 96 134 A 8 8 0 0 1 88 126 Z"/>
    <path d="M 112 126 A 8 8 0 0 1 120 118 L 120 134 A 8 8 0 0 1 112 126 Z"/>
    <path d="M 136 126 A 8 8 0 0 1 144 118 L 144 134 A 8 8 0 0 1 136 126 Z"/>
    <path d="M 160 126 A 8 8 0 0 1 168 118 L 168 134 A 8 8 0 0 1 160 126 Z"/>
    <path d="M 64 150 A 8 8 0 0 1 72 142 L 72 158 A 8 8 0 0 1 64 150 Z"/>
    <path d="M 88 150 A 8 8 0 0 1 96 142 L 96 158 A 8 8 0 0 1 88 150 Z"/>
    <path d="M 112 150 A 8 8 0 0 1 120 142 L 120 158 A 8 8 0 0 1 112 150 Z"/>
    <path d="M 136 150 A 8 8 0 0 1 144 142 L 144 158 A 8 8 0 0 1 136 150 Z"/>
    <path d="M 160 150 A 8 8 0 0 1 168 142 L 168 158 A 8 8 0 0 1 160 150 Z"/>
  </g>

  <!-- Pack Unit Badge -->
  <rect x="70" y="200" width="100" height="20" rx="3" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="120" y="214" font-family="'Noto Serif Bengali', system-ui, sans-serif" font-size="10" font-weight="700" fill="#0369a1" text-anchor="middle">১০টি ক্যাপসুল • স্কয়ার</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" fill="none">
  <defs>
    <linearGradient id="gasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <pattern id="dotPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="rgba(255,255,255,0.08)"/>
    </pattern>
  </defs>

  <rect width="840" height="380" rx="4" fill="url(#gasGrad)"/>
  <rect width="840" height="380" rx="4" fill="url(#dotPattern)"/>

  <!-- Left Content -->
  <g transform="translate(48, 48)">
    <rect width="220" height="28" rx="4" fill="#ffedd5"/>
    <text x="110" y="18" fill="#9a3412" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
      🔥 ইনস্ট্যান্ট এলপি গ্যাস ডেলিভারি
    </text>

    <text x="0" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">
      রান্নার গ্যাস ফুরিয়ে গেছে?
    </text>
    <text x="0" y="125" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="28" font-weight="700">
      খালি সিলিন্ডার বদলে রিফিল নিন
    </text>

    <text x="0" y="170" fill="#ffedd5" font-family="system-ui, sans-serif" font-size="15" font-weight="500">
      বসুন্ধরা, ওমেরা, বেক্সিমকো, বিএম ও যমুনা গ্যাস — দরজায় ওজন মেপে ডেলিভারি
    </text>

    <rect y="195" width="260" height="36" rx="4" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="130" y="218" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      ১-ক্লিক স্ট্যান্ডঅ্যালোন এক্সপ্রেস চেকআউট
    </text>

    <rect y="248" width="180" height="42" rx="4" fill="#f97316"/>
    <text x="90" y="274" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">
      গ্যাস অর্ডার করুন →
    </text>
  </g>

  <!-- Right Visual -->
  <g transform="translate(560, 30)">
    <circle cx="130" cy="160" r="120" fill="rgba(255,255,255,0.08)"/>
    <!-- Gas Cylinder Graphic -->
    <rect x="90" y="60" width="80" height="15" rx="3" fill="#fdba74"/>
    <path d="M 80 85 C 80 75 180 75 180 85 L 180 200 C 180 215 80 215 80 200 Z" fill="#9a3412" stroke="#ea580c" stroke-width="3"/>
    <rect x="95" y="115" width="70" height="35" rx="4" fill="#ea580c"/>
    <text x="130" y="137" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">
      12 KG
    </text>

    <rect x="50" y="260" width="160" height="24" rx="4" fill="rgba(0,0,0,0.3)"/>
    <text x="130" y="276" fill="#ffedd5" font-family="monospace" font-size="11" text-anchor="middle">
      BANNER: 840 x 380 px
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 180" fill="none">
  <defs>
    <linearGradient id="sidePharmaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="380" height="180" rx="4" fill="url(#sidePharmaGrad)"/>

  <g transform="translate(24, 22)">
    <rect width="135" height="22" rx="3" fill="#e0f2fe"/>
    <text x="67" y="15" fill="#0369a1" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">
      📋 প্রেসক্রিপশন আপলোড
    </text>

    <text x="0" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">
      ওষুধ খুঁজে পাচ্ছেন না?
    </text>
    <text x="0" y="76" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="600">
      ছবি তুলে পাঠান, ফার্মাসিস্ট গুছিয়ে দেবে
    </text>

    <text x="0" y="105" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">
      ফ্ল্যাট ১০% ক্যাশব্যাক <tspan font-size="11" fill="#bae6fd">সকল ওষুধে</tspan>
    </text>

    <rect y="118" width="125" height="30" rx="3" fill="#38bdf8"/>
    <text x="62" y="137" fill="#0c4a6e" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">
      ছবি আপলোড করুন →
    </text>
  </g>

  <!-- Rx / Prescription graphic -->
  <g transform="translate(255, 15)">
    <rect x="20" y="20" width="70" height="95" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
    <text x="35" y="50" fill="#0284c7" font-family="serif" font-size="24" font-weight="bold">Rx</text>
    <line x1="35" y1="65" x2="75" y2="65" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="78" x2="68" y2="78" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="91" x2="78" y2="91" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

    <rect x="0" y="135" width="105" height="18" rx="3" fill="rgba(0,0,0,0.35)"/>
    <text x="52" y="147" fill="#e0f2fe" font-family="monospace" font-size="9" text-anchor="middle">
      IMAGE: 380x180
    </text>
  </g>
</svg>

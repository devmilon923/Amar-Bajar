<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" fill="none">
  <defs>
    <linearGradient id="bazarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="840" height="380" rx="4" fill="url(#bazarGrad)"/>
  <rect width="840" height="380" rx="4" fill="url(#gridPattern)"/>

  <!-- Left Content -->
  <g transform="translate(48, 48)">
    <!-- Badge -->
    <rect width="180" height="28" rx="4" fill="#ecfdf5"/>
    <text x="90" y="18" fill="#065f46" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
      🥦 প্রতিদিনের তাজা কাঁচাবাজার
    </text>

    <!-- Headline -->
    <text x="0" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">
      তাজা শাকসবজি, মাছ ও মাংস
    </text>
    <text x="0" y="125" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="28" font-weight="700">
      পৌঁছে যাবে মাত্র ৩০ মিনিটে!
    </text>

    <!-- Subtitle -->
    <text x="0" y="170" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="15" font-weight="500">
      সরাসরি খামার ও আড়ত থেকে বাছাইকৃত ১০০% খাঁটি নিত্যপণ্য
    </text>

    <!-- Promo Highlight Tag -->
    <rect y="195" width="230" height="36" rx="4" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="115" y="218" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      প্রথম অর্ডারে ফ্রি ডেলিভারি • কোড: BAZAR50
    </text>

    <!-- CTA Button Placeholder -->
    <rect y="248" width="160" height="42" rx="4" fill="#10b981"/>
    <text x="80" y="274" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      বাজার শুরু করুন →
    </text>
  </g>

  <!-- Right Visual Mockup -->
  <g transform="translate(560, 40)">
    <circle cx="130" cy="150" r="120" fill="rgba(255,255,255,0.08)"/>
    <!-- Basket / Veggie Graphics -->
    <rect x="50" y="120" width="160" height="110" rx="12" fill="#047857" stroke="#34d399" stroke-width="3"/>
    <path d="M 60 120 C 60 70, 200 70, 200 120" fill="none" stroke="#6ee7b7" stroke-width="8" stroke-linecap="round"/>
    <circle cx="95" cy="110" r="26" fill="#ef4444"/> <!-- Tomato -->
    <circle cx="140" cy="100" r="28" fill="#eab308"/> <!-- Lemon/Orange -->
    <circle cx="175" cy="115" r="22" fill="#22c55e"/> <!-- Veggie -->
    <!-- Placeholder Dimension Indicator -->
    <rect x="50" y="250" width="160" height="24" rx="4" fill="rgba(0,0,0,0.3)"/>
    <text x="130" y="266" fill="#ecfdf5" font-family="monospace" font-size="11" text-anchor="middle">
      BANNER: 840 x 380 px
    </text>
  </g>
</svg>
